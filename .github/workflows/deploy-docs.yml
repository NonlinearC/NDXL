name: Build and Deploy C Documentation

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Extract release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Install Doxygen 1.18.0
        run: |
          curl -fsSL \
            https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz \
            -o doxygen.tar.gz

          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen.tar.gz" \
            | sha256sum --check

          tar -xzf doxygen.tar.gz

          cd doxygen-1.18.0
          sudo make install

          doxygen --version

      - name: Build documentation
        working-directory: docs/c
        env:
          NDXL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/@NDXL_VERSION@/${NDXL_VERSION}/g" src/introduction.md
          doxygen

          test -f build/html/index.html

      - name: Checkout published website
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published

      - name: Update versioned documentation
        env:
          RELEASE_TAG: ${{ steps.version.outputs.version }}
          MINOR_VERSION: ${{ steps.version.outputs.minor }}
        run: |
          TARGET="published/$MINOR_VERSION"

          UPDATE_VERSION=true

          if [[ -f "$TARGET/NDXL_VERSION.txt" ]]; then
            EXISTING_VERSION=$(cat "$TARGET/NDXL_VERSION.txt")
            NEWEST_VERSION=$(printf '%s\n%s\n' \
              "$EXISTING_VERSION" "$RELEASE_TAG" | sort -V | tail -n 1)

            if [[ "$NEWEST_VERSION" != "$RELEASE_TAG" ]]; then
              echo "Skipping older release $RELEASE_TAG."
              echo "Documentation already contains $EXISTING_VERSION."
              UPDATE_VERSION=false
            fi
          fi

          if [[ "$UPDATE_VERSION" == true ]]; then
            rm -rf "$TARGET"
            mkdir -p "$TARGET"

            cp -a docs/c/build/html/. "$TARGET/"
            echo "$RELEASE_TAG" > "$TARGET/NDXL_VERSION.txt"
          fi

      - name: Update latest documentation
        run: |
          LATEST_VERSION=$(
            find published \
              -mindepth 2 -maxdepth 2 \
              -type f -name NDXL_VERSION.txt \
              -not -path 'published/latest/*' \
              -exec cat {} \; \
              | sort -V \
              | tail -n 1
          )

          if [[ -z "$LATEST_VERSION" ]]; then
            echo "No published documentation versions found."
            exit 1
          fi

          LATEST_MINOR="${LATEST_VERSION%.*}"

          rm -rf published/latest
          mkdir -p published/latest

          cp -a "published/$LATEST_MINOR/." published/latest/

      
      - name: Generate version index
        run: |
          LATEST_VERSION=$(cat published/latest/NDXL_VERSION.txt)

          {
            cat <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="color-scheme" content="dark">
            <title>NDXL Documentation</title>

            <style>
              :root {
                color-scheme: dark;
                --bg: #05080e;
                --header: #080d16;
                --surface: #101a2a;
                --surface-hover: #19263a;
                --border: #26354d;
                --text: #c9d6e5;
                --text-muted: #91a4bd;
                --heading: #e5edf7;
                --link: #81b4ff;
                --link-hover: #b1d0ff;
              }

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: "Lato", "Segoe UI", sans-serif;
                font-size: 16px;
                line-height: 1.6;
              }

              a {
                color: var(--link);
                text-decoration: none;
              }

              a:hover {
                color: var(--link-hover);
                text-decoration: underline;
              }

              .topbar {
                background: var(--header);
                border-bottom: 1px solid var(--border);
                padding: 1rem 1.5rem;
              }

              .brand {
                color: var(--heading);
                font-size: 1.15rem;
                font-weight: 600;
                letter-spacing: 0.02em;
              }

              main {
                width: min(900px, 100%);
                margin: 0 auto;
                padding: 4rem 2rem 5rem;
              }

              .intro {
                margin-bottom: 3rem;
              }

              .intro h1 {
                color: var(--heading);
                font-size: 2.4rem;
                font-weight: 700;
                line-height: 1.2;
                margin: 0 0 1rem;
              }

              .intro p {
                color: var(--text-muted);
                margin: 0;
              }

              .latest {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 2rem;
                margin-bottom: 3.5rem;
              }

              .latest h2 {
                color: var(--heading);
                font-size: 1.8rem;
                margin: 0 0 0.5rem;
              }

              .release-version {
                color: var(--text-muted);
                font-size: 1rem;
                margin: 0 0 1.5rem;
              }

              .latest-link {
                display: inline-block;
                background: #315d91;
                border: 1px solid #4779b4;
                border-radius: 5px;
                color: #ffffff;
                font-weight: 600;
                padding: 0.65rem 1.2rem;
                transition: background 0.15s ease;
              }

              .latest-link:hover {
                background: #3e73ad;
                color: #ffffff;
                text-decoration: none;
              }

              .previous h2 {
                color: var(--heading);
                font-size: 1.5rem;
                margin: 0 0 1rem;
              }

              .release-list {
                list-style: none;
                margin: 0;
                padding: 0;
                border-top: 1px solid var(--border);
              }

              .release-list li {
                border-bottom: 1px solid var(--border);
              }

              .release-list a {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
                padding: 0.9rem 1rem;
                transition: background 0.15s ease;
              }

              .release-list a:hover {
                background: var(--surface);
                text-decoration: none;
              }

              .release-name {
                color: var(--link);
                font-weight: 600;
              }

              .release-detail {
                color: var(--text-muted);
                font-size: 0.9rem;
                text-align: right;
              }

              footer {
                border-top: 1px solid var(--border);
                color: var(--text-muted);
                font-size: 0.85rem;
                margin-top: 4rem;
                padding-top: 1.5rem;
              }

              @media (max-width: 600px) {
                main {
                  padding: 2.5rem 1.25rem 3rem;
                }

                .intro h1 {
                  font-size: 2rem;
                }

                .latest {
                  padding: 1.5rem;
                }

                .release-list a {
                  align-items: flex-start;
                  flex-direction: column;
                  gap: 0.2rem;
                }

                .release-detail {
                  text-align: left;
                }
              }
            </style>
          </head>

          <body>
            <header class="topbar">
              <div class="brand">NDXL</div>
            </header>

            <main>
              <section class="intro">
                <h1>NDXL Documentation</h1>
                <p>
                  Documentation and API reference for Network Dynamics eXperimentation Library.
                </p>
              </section>

              <section class="latest">
                <h2>Latest version</h2>
                <p class="release-version">
          EOF

            printf '%s\n' "$LATEST_VERSION"

            cat <<'EOF'
                </p>

                <a class="latest-link" href="latest/">
                  Browse latest documentation →
                </a>
              </section>

              <section class="previous">
                <h2>Release history</h2>

                <ul class="release-list">
          EOF

            while IFS= read -r VERSION_DIR; do
              RELEASE=$(cat "published/$VERSION_DIR/NDXL_VERSION.txt")

              printf '<li><a href="%s/"><span class="release-name">%s</span><span class="release-detail">Documentation for %s →</span></a></li>\n' \
                "$VERSION_DIR" "$VERSION_DIR" "$RELEASE"

            done < <(
              find published \
                -mindepth 2 -maxdepth 2 \
                -type f -name NDXL_VERSION.txt \
                -not -path 'published/latest/*' \
                -printf '%h\n' \
                | sed 's#^published/##' \
                | sort -Vr
            )

            cat <<'EOF'
                </ul>
              </section>

              <footer>
                NDXL · Network Dynamics eXperimentation Library
              </footer>
            </main>
          </body>
          </html>
          EOF
          } > published/index.html


      - name: Commit updated website
        run: |
          touch published/.nojekyll

          git -C published config user.name "github-actions[bot]"
          git -C published config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C published add -A

          if ! git -C published diff --cached --quiet; then
            git -C published commit -m \
              "Update documentation for ${{ steps.version.outputs.version }}"

            git -C published push origin HEAD:gh-pages
          fi

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p public
          cp -a published/. public/
          rm -rf public/.git
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify documentation artifact
        run: |
          echo "Checking published website..."

          test -d public
          test -f public/index.html
          test -f public/latest/index.html

          echo "Files available for deployment:"
          find public -maxdepth 2 -type f | head -30

      - name: Upload documentation
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
